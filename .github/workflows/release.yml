name: Build & Release packages

on:
  push:
    tags:
      - "v*.*.*"
  # Manual re-run for an existing tag (e.g. to re-upload a missing asset).
  # Builds from that tag's commit, not from the branch the run starts on.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to (re)build, e.g. v1.9.7"
        required: true
        type: string

# Tag being released: the pushed tag, or the workflow_dispatch input
env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  # ── Lint: syntax errors / undefined names only (config in pyproject.toml) ─
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Byte-compile
        run: python3 -m compileall -q wavescope_app main.py

      - name: Ruff
        run: |
          python3 -m pip install --quiet "ruff==0.16.9"
          ruff check

  # ── Create the GitHub release once, before any package uploads ────────────
  # The four build jobs run in parallel and each used to call
  # softprops/action-gh-release against a release that might not exist yet,
  # which is a race: whichever job lost the race failed its upload step
  # (most likely how v1.9.5 lost its AppImage and openSUSE RPM).  Creating the
  # release here first means every later upload attaches to an existing one.
  create-release:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release (no assets yet)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          # Only on tag push: on a manual re-run the release already has
          # notes, and softprops would append a second generated copy.
          generate_release_notes: ${{ github.event_name == 'push' }}

  # ── Debian / Ubuntu ─────────────────────────────────────────────────────────
  build-deb:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope_${{ steps.version.outputs.VERSION }}_all.deb
          tag_name: ${{ env.RELEASE_TAG }}

  # ── Fedora / RHEL ────────────────────────────────────────────────────────────
  build-rpm:
    needs: create-release
    runs-on: ubuntu-latest
    # Pinned (not :latest) so a new Fedora release cannot silently change the
    # build environment.  Bump deliberately.
    container: fedora:44
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install rpm-build
        run: dnf install -y rpm-build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build .rpm
        run: |
          chmod +x scripts/build_rpm.sh
          ./scripts/build_rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload .rpm to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope-*.noarch.rpm
          tag_name: ${{ env.RELEASE_TAG }}

  # ── openSUSE ──────────────────────────────────────────────────────────────────
  build-opensuse:
    needs: create-release
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install rpm-build
        run: zypper --non-interactive install rpm-build tar gzip

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Build openSUSE .rpm
        run: |
          chmod +x scripts/build_opensuse.sh
          ./scripts/build_opensuse.sh "${{ steps.version.outputs.VERSION }}"

      - name: Rename to avoid clashing with Fedora/RHEL .rpm
        run: mv wavescope-*.noarch.rpm wavescope-${{ steps.version.outputs.VERSION }}-1.opensuse.noarch.rpm

      - name: Upload openSUSE .rpm to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope-*.opensuse.noarch.rpm
          tag_name: ${{ env.RELEASE_TAG }}

  # ── AppImage ───────────────────────────────────────────────────────────────
  build-appimage:
    needs: create-release
    # Pinned to the oldest still-supported Ubuntu LTS on purpose.  The
    # AppImage bundles this runner's own python3 (venv --copies), so the
    # glibc it links against becomes the minimum glibc for every user.
    # ubuntu-latest (24.04) produced a GLIBC_2.38 dependency that the
    # AppImage catalog tester (ubuntu-22.04, glibc 2.35) rejected.
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Install appimagetool + metadata validators
        run: |
          # appstreamcli / desktop-file-validate: build_appimage.sh validates
          # the AppDir metadata with them (same as the Docker builder image)
          sudo apt-get update -qq
          sudo apt-get install -y -qq appstream desktop-file-utils
          wget -qO appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /opt/appimagetool.AppImage
          printf '#!/usr/bin/env bash\nexec /opt/appimagetool.AppImage --appimage-extract-and-run "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: WaveScope-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          tag_name: ${{ env.RELEASE_TAG }}
