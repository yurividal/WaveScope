name: Build & Release packages

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # ── Create the GitHub release once, before any package uploads ────────────
  # The four build jobs run in parallel and each used to call
  # softprops/action-gh-release against a release that might not exist yet,
  # which is a race: whichever job lost the race failed its upload step
  # (most likely how v1.9.5 lost its AppImage and openSUSE RPM).  Creating the
  # release here first means every later upload attaches to an existing one.
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create release (no assets yet)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

  # ── Debian / Ubuntu ─────────────────────────────────────────────────────────
  build-deb:
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dpkg-dev
        run: sudo apt-get install -y dpkg-dev

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .deb
        run: |
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload .deb to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope_${{ steps.version.outputs.VERSION }}_all.deb
          generate_release_notes: true

  # ── Fedora / RHEL ────────────────────────────────────────────────────────────
  build-rpm:
    needs: create-release
    runs-on: ubuntu-latest
    container: fedora:latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm-build
        run: dnf install -y rpm-build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build .rpm
        run: |
          chmod +x scripts/build_rpm.sh
          ./scripts/build_rpm.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload .rpm to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope-*.noarch.rpm
          generate_release_notes: true

  # ── openSUSE ──────────────────────────────────────────────────────────────────
  build-opensuse:
    needs: create-release
    runs-on: ubuntu-latest
    container: opensuse/tumbleweed
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install rpm-build
        run: zypper --non-interactive install rpm-build tar gzip

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build openSUSE .rpm
        run: |
          chmod +x scripts/build_opensuse.sh
          ./scripts/build_opensuse.sh "${{ steps.version.outputs.VERSION }}"

      - name: Rename to avoid clashing with Fedora/RHEL .rpm
        run: mv wavescope-*.noarch.rpm wavescope-${{ steps.version.outputs.VERSION }}-1.opensuse.noarch.rpm

      - name: Upload openSUSE .rpm to release
        uses: softprops/action-gh-release@v2
        with:
          files: wavescope-*.opensuse.noarch.rpm
          generate_release_notes: true

  # ── AppImage ───────────────────────────────────────────────────────────────
  build-appimage:
    needs: create-release
    # Pinned to the oldest still-supported Ubuntu LTS on purpose.  The
    # AppImage bundles this runner's own python3 (venv --copies), so the
    # glibc it links against becomes the minimum glibc for every user.
    # ubuntu-latest (24.04) produced a GLIBC_2.38 dependency that the
    # AppImage catalog tester (ubuntu-22.04, glibc 2.35) rejected.
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install appimagetool
        run: |
          wget -qO appimagetool-x86_64.AppImage \
            https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /opt/appimagetool.AppImage
          printf '#!/usr/bin/env bash\nexec /opt/appimagetool.AppImage --appimage-extract-and-run "$@"\n' | sudo tee /usr/local/bin/appimagetool >/dev/null
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Build AppImage
        run: |
          chmod +x scripts/build_appimage.sh
          ./scripts/build_appimage.sh "${{ steps.version.outputs.VERSION }}"

      - name: Upload AppImage to release
        uses: softprops/action-gh-release@v2
        with:
          files: WaveScope-${{ steps.version.outputs.VERSION }}-x86_64.AppImage
          generate_release_notes: true
