name: Test Linux and macOS

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            python: "3.10"
          - os: ubuntu-24.04
            python: "3.12"
          - os: macos-15
            python: "3.12"
          - os: macos-15-intel
            python: "3.12"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt
            requirements-macos-build.txt
      - name: Linux Qt libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libgl1 libfontconfig1 libxkbcommon0 libdbus-1-3 libglib2.0-0
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -c constraints.txt "pytest==9.1.1" "ruff==0.16.9"
      - name: Syntax and lint
        run: |
          python -m compileall -q wavescope_app main.py
          python -m ruff check
          bash -n install.sh wavescope scripts/build_macos.sh
      - name: Tests
        run: python -m pytest -q tests
      - name: Native macOS framework imports
        if: runner.os == 'macOS'
        run: |
          python -c "import CoreWLAN, CoreLocation, Foundation, objc; from wavescope_app.macos_wifi import corewlan_available; assert corewlan_available()"
      - name: Build macOS development bundle
        if: runner.os == 'macOS'
        run: |
          python -m pip install -r requirements-macos-build.txt
          WAVESCOPE_PYTHON="$(command -v python)" ./scripts/build_macos.sh
      - name: Check macOS bundle metadata and assets
        if: runner.os == 'macOS'
        run: |
          python - <<'PY'
          import plistlib
          from pathlib import Path
          app = Path("dist/WaveScope.app")
          with (app / "Contents/Info.plist").open("rb") as f:
              info = plistlib.load(f)
          assert info["CFBundleIdentifier"] == "io.github.yurividal.WaveScope"
          assert info["NSLocationUsageDescription"]
          assert info["NSLocationWhenInUseUsageDescription"]
          assert (app / "Contents/Resources/assets/vendors.json").is_file()
          assert (app / "Contents/Resources/assets/icon.svg").is_file()
          PY
          codesign --verify --deep --strict dist/WaveScope.app
      - name: Packaged macOS UI smoke test (no scan or location prompt)
        if: runner.os == 'macOS'
        run: dist/WaveScope.app/Contents/MacOS/WaveScope --smoke-test
