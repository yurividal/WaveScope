# pyproject.toml — project metadata + tool config.
#
# WaveScope is shipped as .deb / .rpm / AppImage (see scripts/), not as a
# PyPI package, so there is no [build-system] table.  The version below must
# be bumped together with VERSION in wavescope_app/core_base.py (the source
# of truth used by the build scripts).

[project]
name = "wavescope"
version = "2.1.0"
description = "Modern WiFi analyzer for Linux"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Mirrors requirements.txt; exact tested pins are in constraints.txt
dependencies = [
    "PyQt6>=6.4.0",
    "pyqtgraph>=0.13.0",
    "numpy>=1.23.0",
]

[project.urls]
Homepage = "https://github.com/yurividal/WaveScope"
Issues = "https://github.com/yurividal/WaveScope/issues"

[tool.ruff]
target-version = "py310"
extend-exclude = [".venv", "_deb_build", "_rpm_build*", "_appimage_build", "squashfs-root"]

[tool.ruff.lint]
# Syntax errors and undefined names only.  The codebase relies on star
# imports, so the default F401/F403/F405 rules would be pure noise.
select = ["E9", "F63", "F7", "F82"]
